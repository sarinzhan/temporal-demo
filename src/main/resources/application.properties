spring.application.name=temporal-demo
server.port=8081

# datasource
spring.datasource.url=jdbc:postgresql://localhost:5433/workflow_demo
spring.datasource.username=workflow
spring.datasource.password=workflow
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.show-sql=true

# workflow scheduler
workflow.scheduler.enabled=true
workflow.scheduler.interval-ms=15000


workflow.instance.url=http://localhost:8081
